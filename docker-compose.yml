version: "3.9"

services:
  mongo:
    image: mongo:latest
    container_name: mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./Server/MagicStreamServer
    container_name: magicstream-backend
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongo:27017
      DATABASE_NAME: magicstream
      ALLOWED_ORIGINS: http://localhost
    depends_on:
      - mongo

  frontend:
    build:
      context: ./Client/magic-stream-client
    container_name: magicstream-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data: